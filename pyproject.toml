[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beehive"
version = "0.2.2"
description = "BeeHive — 集成聊天、项目执行、原型设计与定时任务的 AI 桌面助手"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "httpx>=0.27",
    "deepagents>=0.7",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langchain-mcp-adapters>=0.1",
    "apscheduler>=3.10",
    "lark-oapi>=1.5.5",
    "weixin-ilink>=0.3.5",
    "qrcode>=7.4",
    "cryptography>=43.0",
    "keyring>=25.0",
]

[project.scripts]
beehive = "beehive.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["beehive*"]

[tool.setuptools.package-data]
"beehive.common.ui" = ["resources/*"]
"beehive.features.wokbee" = ["ui/webchat_assets/**/*"]
"beehive.features.dezibee" = ["template/**/*"]
