<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype Workspace</title>
<link rel="stylesheet" href="css/workbench.css">
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════
     DeziBee 原型设计工作台（Prototype Workspace）
     三栏固定骨架：画布导航 | 画布详情（原型页面 / 原型卡片）| 产品需求说明书（PRD）
     页面/卡片/PRD 内容全部由 DeziBee(AI) 在 WORKBENCH_DATA 中定义，
     框架只负责承载与联动。修改数据请同时阅读 GUIDE.md。
     注：通过 DeziBee「预览」打开时，右栏 PRD 可点「✎ 编辑」直接手改并保存
     （写回本文件的 WORKBENCH_DATA.prd，与 AI 编辑同一份数据）。
     ═══════════════════════════════════════════════════════════════ -->
<div id="app">
  <!-- ── 左栏：画布导航（= pages 页面树，由框架自动渲染） ── -->
  <aside id="nav">
    <div class="nav-head">
      <span class="nav-title" id="navProjectTitle">画布导航</span>
      <span class="nav-count" id="navPageCount"></span>
    </div>
    <div class="nav-tree" id="navTree"><!-- JS 渲染页面树 --></div>
    <div class="nav-foot">
      <button id="fitAllBtn" title="自动适应全部内容（当前页面）">⤢ 适应内容</button>
      <button id="originBtn" title="画布回到原点">⌂ 原点</button>
    </div>
  </aside>

  <!-- ── 中栏：画布详情（原型页面 / 原型卡片展示区） ── -->
  <main id="canvasWrap">
    <div class="canvas-toolbar">
      <span id="canvasPageName" class="canvas-page-name"></span>
      <span class="flex-sp"></span>
      <button id="zoomOutBtn" title="缩小">−</button>
      <span id="zoomLabel" class="zoom-label">100%</span>
      <button id="zoomInBtn" title="放大">＋</button>
      <button id="focusBtn" title="聚焦当前选中的原型卡片">◎ 聚焦</button>
      <button id="flowFullscreenBtn" title="隐藏画布目录和 PRD，进入全屏流程原型展示">⛶ 全屏原型</button>
      <button id="exportBtn" class="hidden" title="导出原型">📦 导出</button>
    </div>
    <div id="viewport">
      <div id="world"><!-- 卡片与连线由 JS 按 WORKBENCH_DATA 渲染 -->
        <svg id="links" xmlns="http://www.w3.org/2000/svg"><!-- 关系连线层（随画布缩放平移） --></svg>
      </div>
    </div>
    <div id="cardHint" class="card-hint hidden"></div>
  </main>

  <!-- 拖拽调整 PRD 宽度（双击复位） -->
  <div id="prdResizer" class="prd-resizer" title="左右拖动调整「产品需求说明书」宽度；双击复位"></div>

  <!-- ── 右栏：产品需求说明书（PRD / 需求说明 / 产品文档） ── -->
  <aside id="prd">
    <div class="prd-head">
      <span class="prd-title">产品需求说明书</span>
      <span class="prd-actions">
        <button id="prdEditBtn" title="直接编辑产品需求说明书；保存会写回 demo/index.html">✎ 编辑</button>
        <button id="prdSaveBtn" class="hidden" title="保存到 demo/index.html（Ctrl+S）">✔ 保存</button>
        <button id="prdCancelBtn" class="hidden" title="放弃本次修改">✕ 取消</button>
        <button id="prdTocBtn" class="prd-toc-toggle is-open" aria-label="收起目录" aria-expanded="true" title="收起目录">☰</button>
      </span>
    </div>
    <div id="prdStatus" class="prd-status hidden"></div>
    <nav id="prdToc" class="prd-toc"><!-- JS 渲染 PRD 目录 --></nav>
    <article id="prdBody" class="prd-body"><!-- PRD 内容由 JS 渲染 --></article>
  </aside>
</div>

<!-- 高亮联动浮层 -->
<div id="hlOverlay" class="hidden"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   WORKBENCH_DATA —— DeziBee(AI) 唯一需要编辑的数据区。
   结构说明见 GUIDE.md。核心约定：
   - 每个页面 page.id / 每个卡片 card.id / 每个 PRD 章节锚点 section.id
     必须全局唯一；卡片.prdId ↔ 章节锚点 构成双向关联（唯一 ID，不做名称匹配）。
   - 卡片内容 card.html 是真实 HTML/CSS/JS（禁止用图片模拟页面）。
   ═══════════════════════════════════════════════════════════════ */
const WORKBENCH_DATA = window.WORKBENCH_DATA = {
  project: {
    title: "未命名原型项目",
    version: "v0.1",
    updatedAt: ""
  },

  /* 页面树：第一项固定为需求概述，具体业务页面从第二项开始 */
  pages: [
    {
      id: "page-overview",
      name: "需求概述",
      group: "",            // 多级分组用 "一级/二级"，空串为顶级
      prdId: "sec-overview",
      cards: [
        {
          id: "card-overview",
          name: "需求概述",
          type: "overview",
          x: 120, y: 160,
          w: 720, h: 560,
          shell: "browser",
          status: "draft",              // draft | confirmed | deprecated（自由扩展）
          prdId: "sec-overview",
          html: "<style>.overview{font-family:system-ui;padding:40px;color:#172033;background:#fff;min-height:100%;box-sizing:border-box}.overview h1{margin:0 0 28px;font-size:30px}.overview dl{display:grid;grid-template-columns:120px 1fr;gap:16px 20px;margin:0}.overview dt{color:#667085}.overview dd{margin:0;font-weight:600}</style><div class='overview'><h1>需求名称</h1><dl><dt>版本信息</dt><dd>v0.1</dd><dt>更新时间</dt><dd>待补充</dd><dt>需求状态</dt><dd>草稿</dd><dt>需求负责人</dt><dd>待补充</dd></dl></div>"
        }
      ]
    }
  ],

  /* 卡片间关系：来源 --触发(条件)--> 目标；用于开发理解"什么操作导致什么状态" */
  links: [
    // { id: "lnk-1", from: "card-a", to: "card-b", trigger: "点击「提交」", condition: "校验通过", note: "说明" }
  ],

  /* PRD：章节树；section.anchorId 必须与卡片.prdId 对应（如需） */
  prd: {
    sections: [
      {
        id: "sec-overview",
        title: "1. 本次需求概述",
        level: 2,                       // 2=二级标题，3=三级…
        html: "<h3>1.1. 需求背景和目标</h3><p>说明本次为什么调整，以及希望解决的问题。</p><h3>1.2. 需求概述</h3><p>概括本次涉及的页面和主要变化。</p><h3>1.3. 相关流程</h3><p>如涉及多个页面流转，在这里用文字说明完整流程；不涉及时可删除本节。</p>"
      }
    ]
  }
};
</script>
<script src="js/workbench.js"></script>
</body>
</html>
